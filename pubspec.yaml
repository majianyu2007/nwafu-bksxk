name: nwafu_bksxk
description: >-
  西农教务助手 · Offline timetables, academic grades and course selection
  for Northwest A&F University.
publish_to: "none"
version: 2.0.0+6

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Networking
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # Background & notifications
  flutter_local_notifications: ^22.3.1
  # Captcha OCR: on-device ONNX inference (android/ios/macos/windows/linux).
  flutter_onnxruntime: ^1.8.0
  image: ^4.2.0
  # UI niceties
  dynamic_color: ^1.7.0
  # Web-only: read the companion userscript's install flag (tree-shaken off web).
  web: ^1.1.0
  window_manager: ^0.5.2
  tray_manager: ^0.5.1
  wakelock_plus: ^1.5.2
  flutter_foreground_task: ^11.0.3
  archive: ^4.3.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  pub_semver: ^2.2.0
  pointycastle: ^4.0.0
  timezone: ^0.11.1
  crypto: ^3.0.7
  local_auth: ^3.0.2
  nwafu_connect_ffi:
    path: packages/nwafu_connect_ffi
  ffi: ^2.2.0
  workmanager: ^0.10.10
  device_calendar_plus: ^0.10.1
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  # Keep native plugins on one dependency graph; the current ONNX plugin's
  # Swift module dependencies are not resolved by the generated SPM package.
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  # Bundled captcha OCR model (ONNX) + its charset, loaded on-device.
  assets:
    - assets/models/
    - assets/icons/

  # Fonts are bundled (a GB2312/GBK subset of Noto Sans SC, OFL 1.1) so the app
  # renders Chinese offline and only ever connects to bksxk.nwafu.edu.cn — no
  # font CDN at runtime.
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
